  <text x="1032" y="217" font-family="'Courier New', monospace" font-size="13" fill="#8b949e" opacity="0.85">  stack:</text>
  <text x="1092" y="217" font-family="'Courier New', monospace" font-size="13" fill="#58a6ff" opacity="0.85"> ["MongoDB","Express","React","Node"],</text>

  <text x="1032" y="242" font-family="'Courier New', monospace" font-size="13" fill="#8b949e" opacity="0.85">  openToWork:</text>
  <text x="1142" y="242" font-family="'Courier New', monospace" font-size="13" fill="#3fb950" opacity="0.85"> true</text>

  <text x="1008" y="267" font-family="'Courier New', monospace" font-size="13" fill="#58a6ff" opacity="0.85">}</text>


