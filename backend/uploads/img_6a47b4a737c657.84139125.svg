  <text x="1008" y="116" font-family="'Courier New', monospace" font-size="13" fill="#6e7681">// building products that ship</text>

  <text x="1008" y="142" font-family="'Courier New', monospace" font-size="13" fill="#58a6ff" opacity="0.85">const developer = {</text>

  <text x="1032" y="167" font-family="'Courier New', monospace" font-size="13" fill="#8b949e" opacity="0.85">  name:</text>
  <text x="1086" y="167" font-family="'Courier New', monospace" font-size="13" fill="#a5d6ff" opacity="0.85"> "Karar Hussain",</text>

  <text x="1032" y="192" font-family="'Courier New', monospace" font-size="13" fill="#8b949e" opacity="0.85">  role:</text>
