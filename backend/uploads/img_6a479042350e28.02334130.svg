  <!-- Vertical divider -->
  <line x1="972" y1="48" x2="972" y2="348" stroke="#21262d" stroke-width="1"/>

  <!-- Right panel border lines -->
  <line x1="972" y1="48"  x2="1560" y2="48"  stroke="#21262d" stroke-width="0.5"/>
  <line x1="972" y1="348" x2="1560" y2="348" stroke="#21262d" stroke-width="0.5"/>

  <!-- Corner brackets (right panel) -->
  <polyline points="1548,48 1560,48 1560,62"   fill="none" stroke="#58a6ff" stroke-width="1.2" opacity="0.5"/>
  <polyline points="1548,348 1560,348 1560,334" fill="none" stroke="#58a6ff" stroke-width="1.2" opacity="0.5"/>
  <polyline points="984,48 972,48 972,62"       fill="none" stroke="#58a6ff" stroke-width="1.2" opacity="0.5"/>
  <polyline points="984,348 972,348 972,334"    fill="none" stroke="#58a6ff" stroke-width="1.2" opacity="0.5"/>

  <!-- ===== LEFT CONTENT (shifted right to clear profile photo) ===== -->

