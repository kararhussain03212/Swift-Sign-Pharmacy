  <text x="1008" y="120" font-family="'Courier New', monospace" font-size="20" font-weight="500" fill="#6e7681">// building products that ship</text>

  <text x="1008" y="152" font-family="'Courier New', monospace" font-size="20" font-weight="500" fill="#58a6ff" opacity="0.85">const developer = {</text>

  <text x="1032" y="184" font-family="'Courier New', monospace" font-size="20" font-weight="500" fill="#8b949e" opacity="0.85">  name:</text>
  <text x="1112" y="184" font-family="'Courier New', monospace" font-size="20" font-weight="500" fill="#a5d6ff" opacity="0.85"> "Karar Hussain",</text>

  <text x="1032" y="216" font-family="'Courier New', monospace" font-size="20" font-weight="500" fill="#8b949e" opacity="0.85">  role:</text>
  <text x="1108" y="216" font-family="'Courier New', monospace" font-size="20" font-weight="500" fill="#a5d6ff" opacity="0.85"> "Full Stack Dev",</text>

  <text x="1032" y="248" font-family="'Courier New', monospace" font-size="20" font-weight="500" fill="#8b949e" opacity="0.85">  stack:</text>
  <text x="1120" y="248" font-family="'Courier New', monospace" font-size="20" font-weight="500" fill="#58a6ff" opacity="0.85"> ["MongoDB","Express","React","Node"],</text>

  <text x="1032" y="280" font-family="'Courier New', monospace" font-size="20" font-weight="500" fill="#8b949e" opacity="0.85">  openToWork:</text>
  <text x="1188" y="280" font-family="'Courier New', monospace" font-size="20" font-weight="500" fill="#3fb950" opacity="0.85"> true</text>

  <text x="1008" y="312" font-family="'Courier New', monospace" font-size="20" font-weight="500" fill="#58a6ff" opacity="0.85">}</text>

