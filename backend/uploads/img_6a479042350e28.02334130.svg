  <text x="308" y="297"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="17" font-weight="500"
        fill="#3fb950">Open to Work</text>

  <text x="460" y="297" font-family="Arial, sans-serif" font-size="17" fill="#30363d">·</text>

  <text x="478" y="297"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="17" font-weight="400"
        fill="#6e7681">SZABIST University  ·  CS 2026</text>

  <text x="756" y="297" font-family="Arial, sans-serif" font-size="17" fill="#30363d">·</text>

  <text x="774" y="297"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="17" font-weight="400"
        fill="#6e7681">Pakistan</text>

